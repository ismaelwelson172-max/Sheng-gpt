<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nairobi Sheng GPT</title><style>body{margin:0;font-family:system-ui;background:#0a0a0a;color:#fff;display:flex;flex-direction:column;height:100vh}header{padding:16px;text-align:center;border-bottom:1px solid #222}#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}.msg{max-width:80%;padding:10px 14px;border-radius:14px}.user{align-self:flex-end;background:#ff6a00;color:#000}.bot{align-self:flex-start;background:#1e1e1e}#bar{display:flex;gap:8px;padding:12px;border-top:1px solid #222;background:#111}#bar input{flex:1;padding:12px;border-radius:20px;border:none;background:#222;color:#fff}#bar button{padding:12px 18px;border-radius:20px;border:none;background:#ff6a00;font-weight:bold}</style></head><body><header><h1>🔥 Nairobi Sheng GPT</h1><p>10 free, then KSh 99 M-Pesa</p></header><div id="chat"></div><div id="bar"><input id="msg" placeholder="Andika kwa Sheng..."><button onclick="send()">Tuma</button></div><script>let mpesaCode=localStorage.getItem('mpesaCode')||'';const chatEl=document.getElementById('chat'),msgEl=document.getElementById('msg');function addMsg(t,w){const d=document.createElement('div');d.className='msg '+w;d.innerText=t;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight}function showPaywall(d){const e=document.createElement('div');e.className='msg bot';e.innerHTML=`<b>${d.message}</b><br><br><input id="phone" placeholder="07..."><button onclick="stk()">Lipa 99</button><br><input id="code" placeholder="Weka Code Q..."><button onclick="unlock()">Unlock</button>`;chatEl.appendChild(e)}async function send(){const text=msgEl.value.trim();if(!text)return;addMsg(text,'user');msgEl.value='';const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,mpesaCode})});const data=await r.json();if(data.needPayment)showPaywall(data);else addMsg(data.reply+" ["+data.remaining+"]",'bot')}async function stk(){const phone=document.getElementById('phone').value;const r=await fetch('/api/mpesa/stk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})});const d=await r.json();alert(d.message)}function unlock(){const c=document.getElementById('code').value.trim();if(!c.toUpperCase().startsWith('Q'))return alert('Code lazima ianze na Q');mpesaCode=c;localStorage.setItem('mpesaCode',c);addMsg('Sawa! Uko na unlimited!','bot')}msgEl.addEventListener('keydown',e=>{if(e.key==='Enter')send()});addMsg('Poa! Mimi ni Nairobi Sheng GPT. Uliza kitu - 10 free!','bot');</script></body></html>
